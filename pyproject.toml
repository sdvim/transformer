[tool.poetry]
name = "transformer"
version = "0.1.0"
description = "CLI tool that transforms webpages into arbitrary file types"
authors = ["Transformer Team <team@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.9.0"
playwright = "^1.40.0"
beautifulsoup4 = "^4.12.0"
httpx = "^0.25.0"
tenacity = "^8.2.0"
pydantic-settings = "^2.1.0"
structlog = "^23.2.0"
icalendar = "^5.0.0"
lxml = "^4.9.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-recording = "^0.13.0"
vcrpy = "^5.1.0"
black = "^23.12.0"
isort = "^5.13.0"
mypy = "^1.7.0"

[tool.poetry.scripts]
transform = "transformer.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
